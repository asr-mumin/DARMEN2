<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARMEN</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#EEF8F8;--surface:#fff;--ink:#0E2A33;--muted:#5B7580;--brand:#0B7F8C;--brand2:#14B8C4;--line:#D3E8EA;--accent:#F26B4E;--ok:#1B8A5A;--map:#DDF0F1;--street:#fff;--mount:#C5E3E3;--red:#D93A3A;--blue:#2F6BFF;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1B20;--surface:#11282F;--ink:#E6F4F5;--muted:#8FAAB2;--brand:#33C3CF;--line:#1F3E46;--accent:#FF8468;--ok:#4FD29A;--map:#123238;--street:#1B434B;--mount:#164048;--red:#FF6B6B;--blue:#6B95FF}}
:root[data-theme="dark"]{--bg:#0A1B20;--surface:#11282F;--ink:#E6F4F5;--muted:#8FAAB2;--brand:#33C3CF;--line:#1F3E46;--accent:#FF8468;--ok:#4FD29A;--map:#123238;--street:#1B434B;--mount:#164048;--red:#FF6B6B;--blue:#6B95FF}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:13px 20px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn:hover{filter:brightness(1.1)}.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}.btn.sm{padding:8px 14px;font-size:14px}
.btn.red{background:var(--red);color:#fff}
.hide{display:none!important}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo i{width:34px;height:34px;border-radius:50%;background:var(--brand);display:grid;place-items:center}
select,input[type=search],input[type=number]{padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg)}
.geo{max-width:520px;margin:56px auto;text-align:center;padding:0 20px}
.geo .pin{width:84px;height:84px;margin:0 auto 18px;border-radius:50%;background:var(--brand);display:grid;place-items:center}
.geo h1{font-size:clamp(28px,5vw,38px);font-weight:800}.geo p{color:var(--muted)}
.geo .row{display:grid;gap:10px;margin-top:22px}
.err{color:var(--accent);font-weight:600;font-size:14px;min-height:20px}
.tabs{display:flex;gap:6px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);padding:0 14px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:13px 14px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--brand);border-color:var(--brand)}
.app{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
.searchbar{display:flex;gap:10px;flex-wrap:wrap}
.searchbar input{flex:1 1 280px;font-size:18px;padding:15px 18px;border-radius:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.banner{background:var(--surface);border:1.5px solid var(--line);border-left:5px solid var(--red);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.layout{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.listhead h2{font-size:18px}
.list{display:grid;gap:10px;max-height:640px;overflow-y:auto;padding-right:4px}
.ph{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;text-align:left;width:100%;display:block}
.ph[aria-current=true]{border-color:var(--brand2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand2) 25%,transparent)}
.ph .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ph .name{font-weight:800}.ph .price{font-weight:800;font-size:20px;color:var(--brand);white-space:nowrap}.ph .price.low{color:var(--ok)}
.ph .meta{color:var(--muted);font-size:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 8px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok);margin-top:6px}
.tag.few{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.tag.red{background:color-mix(in srgb,var(--red) 18%,transparent);color:var(--red)}.tag.blue{background:color-mix(in srgb,var(--blue) 18%,transparent);color:var(--blue)}
.mapwrap{position:sticky;top:12px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--map);position:relative;z-index:0}
.mapwrap svg{display:block;width:100%;height:auto}.pinp{cursor:pointer}
.mcol{position:sticky;top:12px}.mcol .mapwrap{position:relative}
#lmap{height:560px;width:100%;background:var(--map);font:inherit}
.logo{letter-spacing:.08em}
#cmap{height:560px;width:100%;background:var(--m-land);font:inherit}#cmap.pick{cursor:crosshair}
.bk{display:grid;gap:8px;margin-top:8px}.bk label{font-weight:600;font-size:14px}.bk input:not([type=checkbox]),.bk select{width:100%}
.bkc{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:4px}.bkc .chk{font-size:14px;font-weight:600}.bkc .chk input{width:18px;height:18px}

#lmap.pick{cursor:crosshair}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:24px;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px}
.set{max-width:640px;display:grid;gap:18px}.set label{display:block;font-weight:700;margin-bottom:8px}
.set select{width:100%;font-size:17px}.set .chips{margin:0}.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--brand)}
.don{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:start}
.don h1{font-size:clamp(26px,4vw,36px);font-weight:800;color:var(--red)}.don .sub{color:var(--muted);max-width:60ch;margin:6px 0 14px}
.ann{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--red);border-radius:16px;padding:16px;margin-bottom:12px}
.ann.t{border-left-color:var(--accent)}.ann.p{border-left-color:var(--brand2)}
.ann .row{display:flex;gap:14px;align-items:center}
.grp{flex:none;width:64px;height:64px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}
.ann.t .grp{background:var(--accent)}.ann.p .grp{background:var(--brand)}
.ann .info{flex:1;min-width:0}.ann .ttl{font-weight:800;font-size:18px}
.more{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:15px}
form.post{display:grid;gap:10px}form.post label{font-weight:600;font-size:14px}form.post select,form.post input{width:100%}
/* real map */
.mk{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:800;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45);font-size:15px;line-height:1}
.mk.h,.mk.c{border-radius:7px}.mk.on{transform:scale(1.3);box-shadow:0 0 0 3px var(--accent)}
.meDot{width:18px;height:18px;border-radius:50%;background:#2F6BFF;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,107,255,.6);animation:ring 1.8s infinite}
@keyframes ring{to{box-shadow:0 0 0 18px rgba(47,107,255,0)}}
.meLbl{font-weight:800;font-size:13px;color:#0E2A33;background:#fff;border-radius:8px;padding:1px 7px;border:1px solid #2F6BFF;white-space:nowrap}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--ink)}
.leaflet-popup-content-wrapper{border-radius:14px}.leaflet-popup-content{margin:12px 14px;font:inherit;font-size:14px;line-height:1.45}
.pop b{font-size:16px}.pop div{margin-top:4px}.pop .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pop a:not(.btn){color:var(--brand);font-weight:700}
.btn.dis{opacity:.5;pointer-events:none}
@media (prefers-reduced-motion:reduce){.meDot{animation:none}}
@keyframes pulse{0%{r:8;opacity:.6}100%{r:26;opacity:0}}.pulse{animation:pulse 1.8s ease-out infinite}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
@media (max-width:860px){.layout,.don{grid-template-columns:1fr}.mapwrap{position:relative;order:-1}.mcol{position:static;order:-1}.list{max-height:none}#lmap,#cmap,#mmap{height:380px}}
.mz{position:absolute;right:10px;top:10px;display:grid;gap:6px;z-index:2000}.mz button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:20px;cursor:pointer;line-height:1}
.mpop{position:absolute;z-index:3000;background:var(--surface);color:var(--ink);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.35);width:270px;max-width:86%;transform:translate(-50%,-100%);margin-top:-6px;padding:12px 14px;font-size:14px;line-height:1.45;cursor:default}
.mpop .x{position:absolute;right:6px;top:0;border:0;background:none;font-size:22px;cursor:pointer;color:var(--muted)}
.mattr{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--surface) 85%,transparent);padding:1px 6px;border-radius:6px;z-index:2000;pointer-events:none}
.mmk{position:absolute;left:0;top:0;cursor:pointer}
/* реалистичная карта (стиль OpenStreetMap) */
:root{--m-land:#f2efe9;--m-res:#e0dfdf;--m-com:#f2dad9;--m-ind:#ebdbe8;--m-park:#c8facc;--m-wood:#add19e;--m-water:#aad3df;--m-bld:#d9d0c9;--m-bldl:#c4b7ab;--m-rc:#c6bfb4;--m-rf:#fff;--m-sc:#c9c47c;--m-sf:#f7fabf;--m-pc:#d9a35e;--m-pf:#fcd6a4;--m-tx:#444;--m-ptx:#2f7a3a;--m-halo:#fff;--m-tree:rgba(82,140,70,.55);--m-foot:#f08070}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m-land:#1d2a2d;--m-res:#22302f;--m-com:#2e2830;--m-ind:#2a2833;--m-park:#1f3b2c;--m-wood:#1a3325;--m-water:#1d4a5a;--m-bld:#33413f;--m-bldl:#3d4d4a;--m-rc:#101a1c;--m-rf:#3a4a4c;--m-sc:#3d4a2a;--m-sf:#55603a;--m-pc:#4a3a22;--m-pf:#7a5d33;--m-tx:#c9d8da;--m-ptx:#7fc48a;--m-halo:#11282f;--m-tree:rgba(110,170,110,.45);--m-foot:#c06a5a}}
:root[data-theme="dark"]{--m-land:#1d2a2d;--m-res:#22302f;--m-com:#2e2830;--m-ind:#2a2833;--m-park:#1f3b2c;--m-wood:#1a3325;--m-water:#1d4a5a;--m-bld:#33413f;--m-bldl:#3d4d4a;--m-rc:#101a1c;--m-rf:#3a4a4c;--m-sc:#3d4a2a;--m-sf:#55603a;--m-pc:#4a3a22;--m-pf:#7a5d33;--m-tx:#c9d8da;--m-ptx:#7fc48a;--m-halo:#11282f;--m-tree:rgba(110,170,110,.45);--m-foot:#c06a5a}
#mmap{height:560px;width:100%;background:var(--m-land);font:inherit}#mmap.pick{cursor:crosshair}
#lmap{background:var(--m-land)}
.mz.real{left:10px;right:auto;top:10px;gap:0;background:#fff;border:2px solid rgba(0,0,0,.25);border-radius:5px;overflow:hidden}
.mz.real button{width:30px;height:30px;border:0;border-radius:0;background:#fff;color:#000;font-size:22px;font-weight:600}.mz.real button+button{border-top:1px solid #ccc}.mz.real button:hover{background:#f4f4f4}
.mattr.real{left:auto;right:0;bottom:0;border-radius:0;color:#333;background:rgba(255,255,255,.8)}
.mscale{position:absolute;left:8px;bottom:8px;z-index:2000;pointer-events:none;border:2px solid #333;border-top:0;padding:0 5px;font-size:11px;font-weight:700;line-height:14px;color:#222;background:rgba(255,255,255,.75);white-space:nowrap}
.mpop.real{width:300px;max-width:88%;border-radius:12px;margin-top:0}
.mpop.real::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:var(--surface)}
.pn{position:relative;width:30px;height:42px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}.pn svg{display:block}.pn.on{transform:scale(1.18);transform-origin:50% 100%}
.pn .pl{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:1px;white-space:nowrap;background:var(--surface);color:var(--ink);border:2px solid;border-radius:12px;padding:0 8px;font:800 12px/20px Manrope,sans-serif}
.pop .ok2{color:var(--ok);font-weight:800}.pop .no2{color:var(--red);font-weight:800}
.pop .mh{margin-top:8px;font-weight:800;font-size:13px;color:var(--muted)}
.pop .mlist{max-height:110px;overflow-y:auto;margin-top:4px;border-top:1px solid var(--line)}
.pop .mr{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line);font-size:13px;margin-top:0}
.pop .mr.off{color:var(--muted)}.pop .mr.cu{font-weight:800;background:color-mix(in srgb,var(--brand2) 14%,transparent)}
.ph.off{opacity:.72}.sep{font-weight:800;color:var(--muted);font-size:14px;margin:6px 2px 0}
.banner.ok{border-left-color:var(--brand)}
</style>
</head>
<body>
<header>
  <div class="logo"><i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></i>DARMEN</div>
  <select id="hl" aria-label="Language"><option value="ru">Русский</option><option value="kk">Қазақша</option><option value="en">English</option></select>
</header>

<main id="s-geo" class="geo">
  <div class="pin"><svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
  <h1 data-i="geoT"></h1>
  <p data-i="geoP"></p>
  <div class="row"><button class="btn" id="geoBtn" data-i="geoB"></button>
    <label for="gc" style="font-weight:600;text-align:left" data-i="sCity"></label><select id="gc" style="width:100%;font-size:17px"></select>
    <button class="btn ghost" id="geoSkip" data-i="geoS"></button></div>
  <p class="err" id="geoErr" role="alert"></p>
</main>

<div id="s-app" class="hide">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div class="app">
    <section id="v-meds">
      <form class="searchbar" id="sform" autocomplete="off">
        <input type="search" id="q" list="meds" aria-label="Search">
        <datalist id="meds"></datalist>
        <button class="btn" type="submit" data-i="find"></button>
      </form>
      <div class="chips" id="chips"></div>
      <div class="banner hide" id="banner"></div>
      <div class="banner ok hide" id="pbanner"></div>
      <div class="chips" id="mtools"></div>
      <div class="layout">
        <section>
          <div class="listhead"><h2 id="lh"></h2><div><button class="chip" id="sortD"></button> <button class="chip" id="sortP"></button></div></div>
          <div class="list" id="list"></div>
          <p class="note" id="note"></p>
        </section>
        <div class="mcol"><div class="mapwrap"><div id="mmap"></div></div><div class="banner hide" id="mpanel" style="margin:12px 0 0"></div></div>
      </div>
    </section>
    <section id="v-hosp" class="hide">
      <div class="listhead"><h2 data-i="hl2"></h2><div id="hchips" class="chips" style="margin:0"></div></div>
      <form class="searchbar" id="hform" autocomplete="off">
        <input type="search" id="hq" aria-label="Search">
        <button class="btn" type="submit" data-i="find"></button>
      </form>
      <div class="chips" id="htools"></div>
      <p class="note" id="hstat" role="status" style="margin:0 0 12px"></p>
      <div class="layout">
        <div><div class="list" id="hlist"></div><p class="note" id="hnote"></p></div>
        <div class="mcol"><div class="mapwrap"><div id="lmap"></div></div><div class="banner hide" id="rpanel" style="margin:12px 0 0"></div></div>
      </div>
    </section>
    <section id="v-cat" class="hide">
      <div class="listhead"><h2 id="ch"></h2></div>
      <form class="searchbar" id="cform" autocomplete="off">
        <input type="search" id="cq" aria-label="Search">
        <button class="btn" type="submit" data-i="find"></button>
      </form>
      <div class="chips" id="csv"></div>
      <div class="chips" id="ctools"></div>
      <div class="banner hide" id="cban"></div>
      <p class="note" id="cstat" role="status" style="margin:0 0 12px"></p>
      <div class="layout">
        <div><div class="list" id="clist"></div><p class="note" id="cnote"></p></div>
        <div class="mcol"><div class="mapwrap"><div id="cmap"></div></div><div class="banner hide" id="cpanel" style="margin:12px 0 0"></div></div>
      </div>
    </section>
    <section id="v-don" class="hide"></section>
    <section id="v-set" class="hide"></section>
  </div>
</div>

<script>/* Встроенная карта: реалистичная подложка в стиле OpenStreetMap (рисуется кодом) + настоящие тайлы OSM, если есть интернет. */
(function(){
const NS="http://www.w3.org/2000/svg",RD=Math.PI/180,Z0=10,Z1=18;
const mx=(g,z)=>(g+180)/360*256*2**z,my=(a,z)=>(1-Math.log(Math.tan(a*RD)+1/Math.cos(a*RD))/Math.PI)/2*256*2**z;
const ux=(x,z)=>x/(256*2**z)*360-180,uy=(y,z)=>Math.atan(Math.sinh(Math.PI-2*Math.PI*y/(256*2**z)))/RD;
const hav=(a,b)=>{const dl=(b.lat-a.lat)*RD,dg=(b.lng-a.lng)*RD,x=Math.sin(dl/2)**2+Math.cos(a.lat*RD)*Math.cos(b.lat*RD)*Math.sin(dg/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
const ll=(a,g)=>({lat:a,lng:g,distanceTo(o){return hav(this,o)}});
const P=a=>Array.isArray(a)?ll(a[0],a[1]):ll(a.lat,a.lng);
const hs=(a,b)=>{let h=Math.imul(a,73856093)^Math.imul(b,19349663);h=Math.imul(h^h>>>13,1274126177);return(h^h>>>16)>>>0};
/* --- процедурный «город»: слегка повёрнутая сетка улиц, районы, парки, река, дома --- */
const MXD=111320*Math.cos(45*RD),MYD=110574,TH=-.21,CS=Math.cos(TH),SN=Math.sin(TH),SU=140,SV=110;
const md=(a,n)=>((a%n)+n)%n,rd=(a,b,c)=>hs((a*131+(c||0)*7919)|0,(b*197+(c||0)*104729)|0)/4294967296,r1=n=>Math.round(n*10)/10;
const ul=i=>i*SU+(rd(i,0,1)-.5)*34,vl=j=>j*SV+(rd(j,0,2)-.5)*28;
const ucl=i=>md(i,6)===0?2:md(i,3)===0?1:0,vcl=j=>md(j,7)===0?2:md(j,7)===3?1:0;
const toUV=(lat,lng)=>{const x=lng*MXD,y=lat*MYD;return[x*CS+y*SN,-x*SN+y*CS]};
const fromUV=(u,v)=>{const x=u*CS-v*SN,y=u*SN+v*CS;return[y/MYD,x/MXD]};
const rivV=(u,k)=>k*9000+3600+(rd(k,1,3)-.5)*2400+650*Math.sin(u/2600+k)+220*Math.sin(u/760+k*2);
const dtype=(a,b,l)=>{const r=rd(a,b,3+l);return r<.09?"w":r<.17?"p":r<.29?"i":r<.45?"c":"r"};
const DC={w:"var(--m-wood)",p:"var(--m-park)",i:"var(--m-ind)",c:"var(--m-com)",r:"var(--m-res)"};
const nA=a=>a>90?a-180:a<-90?a+180:a,ex=s=>String(s).replace(/[&<>]/g,"");

async function ovpNet(q){
  let last;

    catch(e){clearTimeout(tm);last=e}

}

  let last;
  for(const u of bases){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),20000);
    try{const r=await fetch(u+co,{signal:ac.signal});clearTimeout(tm);const j=await r.json();if(j.code==="Ok"&&j.routes&&j.routes[0])return j.routes[0];throw new Error(j.code||"route")}catch(e){clearTimeout(tm);last=e}}

/* схема на вкладке «Лекарства» (демо-аптеки) */
function drawMap(svg,items,cb){
  let s=`<rect width="800" height="560" fill="var(--map)"/><path d="M0 470 Q120 430 230 465 T450 450 T650 470 T800 440 V560 H0Z" fill="var(--mount)"/>
  <text x="400" y="535" text-anchor="middle" font-size="14" fill="var(--muted)" font-weight="600">${t("south")}</text><g stroke="var(--street)" stroke-width="7" fill="none" stroke-linecap="round">`;
  for(let i=1;i<7;i++)s+=`<path d="M0 ${i*62} L800 ${i*62-18+i*4}"/>`;
  for(let i=1;i<9;i++)s+=`<path d="M${i*88} 0 L${i*88+20-i*3} 440"/>`;
  s+=`</g>`;
  items.sort((a,b)=>(a.on?1:0)-(b.on?1:0)).forEach(o=>{const{x,y}=o;
    s+=`<g class="pinp" data-k="${o.k}" data-id="${esc(o.id)}" tabindex="0" role="button">`;
    if(o.k==="p"){s+=`<circle cx="${x}" cy="${y}" r="${o.on?15:11}" fill="${o.on?"var(--accent)":"var(--brand)"}" stroke="#fff" stroke-width="3"/><path d="M${x-4} ${y}h8M${x} ${y-4}v8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`;
      if(o.lbl){const w=o.lbl.length*8+16;s+=`<rect x="${x-w/2}" y="${y-44}" width="${w}" height="24" rx="12" fill="var(--surface)" stroke="${o.on?"var(--accent)":"var(--brand)"}" stroke-width="2"/><text x="${x}" y="${y-27}" text-anchor="middle" font-size="13" font-weight="800" fill="var(--ink)">${o.lbl}</text>`}}
    else{const z=o.small?9:12,c=o.k==="h"?"var(--red)":"var(--blue)";s+=`<rect x="${x-z}" y="${y-z}" width="${z*2}" height="${z*2}" rx="5" fill="${c}" stroke="#fff" stroke-width="3"/>`+(o.k==="h"?`<text x="${x}" y="${y+z/2.4}" text-anchor="middle" font-size="${z*1.3}" font-weight="800" fill="#fff">H</text>`:`<path d="M${x-z/2} ${y}h${z}M${x} ${y-z/2}v${z}" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>`)}
    s+=`</g>`});
  const m=meD();if(m){const[X,Y]=px(m.lat,m.lng);s+=`<circle class="pulse" cx="${X}" cy="${Y}" r="8" fill="#2F6BFF"/><circle cx="${X}" cy="${Y}" r="9" fill="#2F6BFF" stroke="#fff" stroke-width="3"/><text x="${X+16}" y="${Y+5}" font-size="14" font-weight="800" fill="var(--ink)">${t(me.gps&&!out?"here":"manual")}</text>`}
  svg.innerHTML=s;
  const go=e=>{const g=e.target.closest(".pinp");if(g)cb(g.dataset.k,g.dataset.id)};
  svg.onclick=go;svg.onkeydown=e=>{if(e.key==="Enter")go(e)};
}

  let sl="";for(let h=8;h<18;h++)["00","30"].forEach(m=>{const s=String(h).padStart(2,"0")+":"+m;sl+=`<option>${s}</option>`});
  p.innerHTML=`<b>${t("bkT")}</b><br>${esc(cnm(x))}<form class="bk" id="bf"><label>${t("bDate")}<select id="bd">${days}</select></label><label>${t("bTime")}<select id="bt">${sl}</select></label>
   <div><b style="font-size:14px">${t("bAn")}</b><div class="bkc">${SV.map(s=>`<label class="chk"><input type="checkbox" value="${s[0]}" ${s[0]===pre?"checked":""}>${esc(s[1][LI])} · ${money(cpr(x,s))}</label>`).join("")}</div></div>
   <label>${t("bName")}<input id="bn" autocomplete="name"></label><label>${t("bTel")}<input id="bp" type="tel" autocomplete="tel" placeholder="+7"></label>
   <p id="bsum" style="margin:0;font-weight:800"></p><p class="err" id="berr" role="alert"></p><button class="btn" type="submit">${t("bSend")}</button></form>`;
  const f=$("#bf"),pick=()=>[...f.querySelectorAll("input[type=checkbox]:checked")].map(i=>i.value),sum=()=>{const n=pick();$("#bsum").textContent=t("bTot",{n:money(n.reduce((a,i)=>a+cpr(x,SV.find(z=>z[0]===i)),0))});return n};
  f.onchange=sum;sum();
  f.onsubmit=e=>{e.preventDefault();const n=sum(),nm=$("#bn").value.trim(),ph=$("#bp").value.trim();
    if(!nm||ph.replace(/\D/g,"").length<10||!n.length){$("#berr").textContent=t("bErr");return}
    const code="DM-"+(1000+Math.floor(Math.random()*9000)),total=n.reduce((a,i)=>a+cpr(x,SV.find(z=>z[0]===i)),0);
    bkS([{code,lab:cnm(x),lt:x.phone,ts:new Date($("#bd").value+"T"+$("#bt").value).getTime(),items:n,total,name:nm,tel:ph},...bkL()]);
    p.innerHTML=`<b>${t("bOk",{c:code})}</b><p style="margin:8px 0">${t("bOk2")}</p><div class="chips" style="margin:8px 0 0">${x.phone?`<a class="btn sm" href="tel:${telc(x.phone)}">${t("call")}</a>`:""}<button class="chip" type="button" onclick="lsub='mine';renderCat()">${t("myRec")}</button></div>`};
  p.scrollIntoView({block:"nearest",behavior:"smooth"})}
$("#csv").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;csv[tab]=csv[tab]===b.dataset.s?null:b.dataset.s;if(!csvo()||!csvo()[2])cso="d";renderCat(1,1)};
$("#cform").onsubmit=e=>{e.preventDefault();cq=$("#cq").value.trim().toLowerCase();renderCat(1,1)};
$("#ctools").onclick=e=>{const b=e.target.closest("[data-a]");if(!b||!me)return;const a=b.dataset.a,k=tab;
  if(a==="sd"||a==="sp"){cso=a==="sd"?"d":"p";renderCat()}
  else if(a==="refresh"){loadC(k,me.lat,me.lng)}
  else if(a==="here"&&CM){const c=CM.getCenter();cq="";$("#cq").value="";loadC(k,c.lat,c.lng,Math.max(1500,Math.min(15000,Math.round(c.distanceTo(CM.getBounds().getNorthEast())))))}
  else if(a==="loc"){if(!navigator.geolocation){csm=t("locErr");renderCat();return}csm=t("geoW");renderCat();
    navigator.geolocation.getCurrentPosition(p=>{gotGps(p);csm="";if(CM)CM.setView([me.lat,me.lng],15);renderCat()},()=>{csm=t("locErr");renderCat()},{timeout:12000,enableHighAccuracy:true})}
  else if(a==="pick"){cpk=!cpk;$("#cmap").classList.toggle("pick",cpk);renderCat()}
  else if(a==="mine"){lsub=lsub==="mine"?"find":"mine";renderCat()}};
$("#ctools").onchange=e=>{if(e.target.id!=="cc")return;S.city=e.target.value;save();toCenter();cd={};loadAround(me.lat,me.lng,5000,true);if(CM)CM.setView([me.lat,me.lng],14);renderCat()};
$("#clist").onclick=e=>{const b=e.target.closest("[data-bk]");
  if(b){const[a,code]=b.dataset.bk.split(":");let A=bkL();if(a==="del")A=A.filter(z=>z.code!==code);else A.forEach(z=>{if(z.code===code)z.ts=Date.now()-30*36e5});bkS(A);renderCat();return}
  if(e.target.closest("a,button"))return;const c=e.target.closest(".ph[data-id]");if(c)cFocus(c.dataset.id)};
$("#clist").onkeydown=e=>{if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.id)cFocus(e.target.dataset.id)};
$("#cpanel").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;if(b.dataset.m==="x"){if(crL&&CM)CM.removeLayer(crL);crL=null;cdest=null;$("#cpanel").classList.add("hide")}else cRoute(cdest,b.dataset.m)};

/* ===== офлайн-данные и маршруты (демо) ===== */
const mb=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const hn=s=>{let h=5381;for(const c of s)h=Math.imul(h,33)^c.charCodeAt(0);return h>>>0};
const WD=["Нур","Алтын","Береке","Шипагер","Жарық","Арман","Сапа","Дана","Қамқор","Жастар","Ұлан","Таң","Айгерим","Наурыз","Бастау","Мирас"];
const DIS=["Городской психоневрологический диспансер","Центр психического здоровья","Наркологический диспансер","Противотуберкулезный диспансер №1","Онкологический диспансер","Кожно-венерологический диспансер","Областной психоневрологический диспансер","Противотуберкулезный диспансер №2","Детский психоневрологический диспансер","Республиканский наркологический центр"];
function anchor(lat,lng){let bk=null,bd=1e9;for(const k of CK){const c=CITIES[k].c,d=dist(lat,lng,c[0],c[1]);if(d<bd){bd=d;bk=k}}return{k:bd<150?bk:null,lat,lng}}
function gen(cat,a){
  const R=mb(hn((a.k||"x"+a.lat.toFixed(1)+a.lng.toFixed(1))+cat)),tri=()=>R()+R()-1,cc=a.k?CITIES[a.k]:null,sts=cc?cc.st:ST0,code=cc?cc.code:"727",W=()=>WD[Math.floor(R()*WD.length)];
  const kinds={med:[...Array(8).fill("h"),...Array(14).fill("c"),...Array(20).fill("p")],lab:Array(30).fill("l"),dx:Array(28).fill("d"),dent:Array(30).fill("s"),dis:DIS.map((_,i)=>i)}[cat],off={med:0,lab:100,dx:200,dent:300,dis:400}[cat];
  return kinds.map((k,i)=>{const tg={},N=1+Math.floor(R()*24);let name;
    if(cat==="med"){if(k==="h"){tg.amenity="hospital";name=["Городская больница №","Областная клиническая больница №","Центральная больница №","Многопрофильная больница №"][i%4]+N}
      else if(k==="c"){tg.amenity="clinic";name=["Городская поликлиника №"+N,"Медицинский центр «"+W()+"»","Семейная поликлиника №"+N][i%3]}
      else{tg.amenity="pharmacy";name=["Аптека «"+W()+"»",W()+" Фарм","Аптека №"+N][i%3]}}
    else if(cat==="lab"){tg.healthcare="laboratory";name=["Лаборатория «"+W()+"»",W()+" Лаб","Медлаборатория «"+W()+"»"][i%3]}
    else if(cat==="dx"){tg.amenity="clinic";name=["МРТ-центр «"+W()+"»","Центр КТ «"+W()+"»","УЗИ-клиника «"+W()+"»","Рентген-центр «"+W()+"»","Центр МРТ и КТ «"+W()+"»","Диагностический центр «"+W()+"»","Центр диагностики «"+W()+"»"][i%7]}
    else if(cat==="dent"){tg.amenity="dentist";name=["Стоматология «"+W()+"»","Dental "+W(),"Стоматологическая клиника «"+W()+"»"][i%3]}
    else{tg.healthcare="clinic";name=DIS[k]}
    const oh=k==="h"?"24/7":cat==="lab"?"Mo-Sa 07:00-17:00":(k==="p"&&R()<.25)?"24/7":R()<.5?"Mo-Fr 08:00-18:00":"Mo-Su 09:00-20:00",n=String(1000000+Math.floor(R()*8999999));
    return{type:"node",id:off+i+1,lat:a.lat+tri()*.03,lon:a.lng+tri()*.04,tags:{...tg,name,"addr:street":sts[Math.floor(R()*12)],"addr:housenumber":String(1+Math.floor(R()*120)),"addr:city":cc?cc.n[0]:"",phone:`+7 (${code}) ${n.slice(0,3)}-${n.slice(3,5)}-${n.slice(5,7)}`,opening_hours:oh}}})}
async function ovp(q){const m=q.match(/around:(\d+),(-?[\d.]+),(-?[\d.]+)/);if(!m)return[];const r=+m[1],lat=+m[2],lng=+m[3],
  cat=/dentist/.test(q)?"dent":/laboratory/.test(q)?"lab":/диспансер/.test(q)?"dis":/radiology/.test(q)?"dx":"med";
  let els=gen(cat,anchor(lat,lng)).filter(e=>dist(lat,lng,e.lat,e.lon)*1000<=r);
  const n=r===40000&&q.match(/"name"~"\(([^"]+)\)"/);if(n){const re=new RegExp(n[1],"i");els=els.filter(e=>re.test(e.tags.name))}
  return els}
async function osrm(mode,a,b){const d=(dist(a.lat,a.lng,a.lat,b.lng)+dist(a.lat,b.lng,b.lat,b.lng))*1000;
  return{geometry:{type:"LineString",coordinates:[[a.lng,a.lat],[b.lng,a.lat],[b.lng,b.lat]]},distance:d,duration:d/(mode==="foot"?1.35:7.5)}}

setLang(S.lang);
/* сразу просим доступ к геолокации при открытии сайта */
if(navigator.geolocation)setTimeout(()=>{if(!$("#s-geo").classList.contains("hide"))$("#geoBtn").click()},400);
</script>
